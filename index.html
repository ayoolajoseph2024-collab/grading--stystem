<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoGrade Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="edu-card">
      
      <div class="header">
        <div class="logo"><img src="svgexport-1.svg" alt="" width=""></div>
        <h2>JoGrade Pro</h2>
        <p>Smart Grading </p>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="setLevel('university', this)">University</button>
        <button class="tab" onclick="setLevel('polytechnic', this)">Polytechnic</button>
        <button class="tab" onclick="setLevel('secondary', this)">Secondary</button>
      </div>

      <label>Student Name</label>
      <input type="text" id="nameInput" placeholder="Enter full name"/>

      <label>Score (0 - 100)</label>
      <input type="number" id="scoreInput" placeholder=" grades" oninput="livePreview()" />

      <button class="main-btn" onclick="checkGrade()">Generate Result</button>

      <div id="display">
        <div class="empty">
          <span>Your result will appear here</span>
        </div>
      </div>

      <div id="scaleInfo" class="scale-info"></div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
